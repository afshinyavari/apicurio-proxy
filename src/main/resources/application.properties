# Every property can be overridden by its environment variable form, e.g.
# proxy.apicurio.url -> PROXY_APICURIO_URL, quarkus.oidc.auth-server-url -> QUARKUS_OIDC_AUTH_SERVER_URL.

quarkus.http.port=8082

# OIDC — bearer tokens only, no redirect/login. The group claim becomes the caller's groups.
# Set QUARKUS_OIDC_AUTH_SERVER_URL, or QUARKUS_OIDC_TENANT_ENABLED=false for mTLS only.
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=groups

# TLS + mTLS from PEM files: PROXY_TLS_CERT + PROXY_TLS_KEY (PKCS#8) for the listener, PROXY_TLS_CA
# for the CAs client certificates must chain to. Set QUARKUS_HTTP_INSECURE_REQUESTS=disabled with
# them to close the plain-HTTP port. client-auth is build-time: "request" makes a client
# certificate optional, so OIDC bearer requests and mTLS requests coexist on one listener.
quarkus.http.ssl.certificate.files=${PROXY_TLS_CERT:}
quarkus.http.ssl.certificate.key-files=${PROXY_TLS_KEY:}
quarkus.http.ssl.certificate.trust-store-file=${PROXY_TLS_CA:}
quarkus.http.ssl.certificate.trust-store-file-type=PEM
quarkus.http.ssl.client-auth=request

# Failed TLS handshakes (an untrusted client certificate, a client rejecting the proxy's certificate,
# no common protocol) happen before any HTTP request, so the audit log never sees them. Vert.x logs
# them only at TRACE, on this category: the build allows TRACE there, and PROXY_LOG_TLS_HANDSHAKE_LEVEL=TRACE
# turns it on. Off by default, since a TCP health check that connects and closes is a failed handshake too.
quarkus.log.category."io.vertx.core.http.impl.HttpServerImpl".min-level=TRACE
quarkus.log.category."io.vertx.core.http.impl.HttpServerImpl".level=${proxy.log.tls-handshake-level:INFO}

# Upstream registry
proxy.apicurio.url=http://apicurio:8080

# Policy file, polled for changes and reloaded without a restart
proxy.policy.file=/opt/rbac/policy.yaml
proxy.policy.reload-interval=5s

# Certificate subject -> Kafka principal: the brokers' ssl.principal.mapping.rules, verbatim
proxy.mtls.principal-mapping-rules=DEFAULT

# Kafka ACLs for certificate callers; enabled by proxy.kafka.bootstrap
# (also proxy.kafka.security-protocol, proxy.kafka.ssl.cert / .key / .ca as PEM files)
proxy.kafka.acl-refresh-interval=30s

# Requests answered 401: the first from a source is logged, its repeats are summarized this often
proxy.audit.repeat-summary-interval=60s

# Drain in-flight requests before hard stop (HA rolling restarts)
quarkus.shutdown.timeout=15S

# Test profile — no real OIDC; the registry is unreachable, so an allowed request answers 502
%test.quarkus.oidc.enabled=false
%test.quarkus.http.test-port=0
%test.proxy.policy.file=src/test/resources/test-policy.yaml
%test.proxy.apicurio.url=http://localhost:19999
