# Weekly PRs for new versions of the Java dependencies, the UBI base image (Dockerfile, tag and
# digest) and the GitHub Actions. Each PR runs the docker workflow: unit and Quarkus tests, then a
# smoke test of the built image over TLS and mTLS. Nothing is pushed to Docker Hub from a PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Quarkus BOM and the Quarkus Maven plugin share quarkus.platform.version.
      quarkus:
        patterns: ["io.quarkus*"]
      java:
        patterns: ["*"]
        exclude-patterns: ["io.quarkus*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
