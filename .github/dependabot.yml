# Weekly PRs for new versions of the Java dependencies, the UBI base image (Dockerfile, tag and
# digest), the Kafka broker of the integration test and the GitHub Actions. Each PR runs the docker workflow: unit and Quarkus tests, then
# the built image tested over TLS and mTLS and against a real Kafka broker. Nothing is pushed to
# Docker Hub from a PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Quarkus BOM and the Quarkus Maven plugin share quarkus.platform.version.
      quarkus:
        patterns: ["io.quarkus*"]
      java:
        patterns: ["*"]
        exclude-patterns: ["io.quarkus*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The Kafka broker of the integration test; we run 4.x.
  - package-ecosystem: docker
    directory: /e2e/kafka
    schedule:
      interval: weekly
    ignore:
      - dependency-name: apache/kafka
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
